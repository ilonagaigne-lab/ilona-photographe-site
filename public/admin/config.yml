                widget: list
                summary: "{{fields.alt}}"
                fields: *champs-photo
          - label: Page de résultat
            name: resultat
            widget: object
            fields:
              - { label: Petit titre au-dessus de la séance, name: surtitre, widget: string, hint: "Petite ligne au-dessus du nom de la séance conseillée. Ex. : Votre séance" }
              - { label: Titre du conseil, name: titreConseil, widget: string, hint: "Titre de l’encadré de conseil. Ex. : Le conseil d’Ilona" }
              - label: Conseils (selon le caractère du cheval)
                name: conseils
                widget: list
                summary: "{{fields.valeur}}"
                allow_add: false
                min: 3
                max: 3
                fields:
                  - { label: Caractère, name: valeur, widget: hidden }
                  - { label: Conseil, name: texte, widget: text, hint: "Conseil adapté au caractère du cheval. Ex. : Un cheval posé se prête aux plans rapprochés : on prendra le…" }
              - { label: Titre des soirs de lumière dorée, name: titreSoirs, widget: string, hint: "Titre de la liste des prochains samedis. Ex. : Lumière dorée à Toulouse ces prochains samedis" }
              - { label: Petite note sous les soirs, name: noteSoirs, widget: string, hint: "Petite note sous la liste des samedis. Ex. : Heures calculées pour Toulouse. Vous pouvez aussi demander un…" }
              - { label: Phrase avant le lien, name: hesitation, widget: string, hint: "Phrase avant le lien vers les séances. Ex. : Vous hésitez encore ?" }
              - { label: Texte du lien vers les séances, name: lienComparer, widget: string, hint: "Lien vers la page Séances. Ex. : Comparer les quatre formules" }

