# Back office d'Ilona (Decap CMS). Chaque enregistrement crée une modification sur GitHub,
# puis Vercel remet le site en ligne en une à deux minutes.
# Fichier assemblé : les pages viennent de fragments (une entrée par page sous « Pages du site »).
backend:
  name: github
  repo: ilonagaigne-lab/ilona-photographe-site
  branch: main
  base_url: https://ilonagaigne.com
  auth_endpoint: api/auth
  commit_messages:
    update: "Back office : {{slug}} mis à jour"
    uploadMedia: "Back office : ajout de {{path}}"
    deleteMedia: "Back office : suppression de {{path}}"

# Sur l'ordinateur de développement uniquement (npx decap-server) : modifie les fichiers en local.
local_backend: true

locale: fr
site_url: https://ilonagaigne.com
display_url: https://ilonagaigne.com
logo_url: /favicon.svg
# Photos : rangées avec celles du site, puis optimisées automatiquement à la mise en ligne.
media_folder: src/assets/photos
public_folder: /src/assets/photos

collections:
  - name: reglages
    label: Formules et coordonnées
    description: Vos prix, ce que contient chaque formule, le calcul des déplacements et vos coordonnées. Modifiés une fois, ils s’appliquent partout sur le site.
    editor: { preview: false }
    files:
      - name: prestations
        label: Formules et tarifs
        file: src/contenu/prestations.json
        description: Les prix et contenus saisis ici s’appliquent partout sur le site (pages, réservation, quiz, questions fréquentes, Google).
        fields:
          - label: Séances équestres
            name: seances
            widget: list
            summary: "{{fields.nom}} · {{fields.prix}} €"
            min: 1
            fields:
              - { label: Identifiant, name: id, widget: hidden }
              - { label: Nom, name: nom, widget: string, hint: "Nom de la formule, affiché sur les cartes et dans la réservation. Ex. : Sport" }
              - { label: Prix (€), name: prix, widget: number, value_type: int, min: 0, hint: "Prix en euros, sans le symbole. Il se met à jour partout sur le site. Ex. : 90" }
              - { label: Accroche, name: accroche, widget: text, hint: "Phrase courte sous le nom de la formule. Ex. : Votre couple en mouvement : le geste, l’effort, la…" }
              - label: Ce qui est inclus
                name: details
                widget: list
                required: false
                hint: "Une ligne par élément, ex. : 1 h de séance, 15 photos retouchées"
                field: { label: Élément, name: element, widget: string }
              - label: Photo
                name: photo
                widget: object
                fields: &champs-photo
                  - { label: Image, name: image, widget: image, choose_url: false, hint: "Photo en JPG, de préférence moins de 10 Mo. Ne supprimez pas de la médiathèque une photo encore utilisée sur le site : la mise en ligne échouerait." }
                  - { label: Description de la photo, name: alt, widget: string, required: false, hint: "Ce que montre la photo, pour Google et les personnes malvoyantes. Ex. : Cavalière et son cheval bai au pré." }
                  - label: Cadrage
                    name: cadrage
                    widget: select
                    required: false
                    default: ""
                    hint: "Partie de la photo à garder visible quand elle est recadrée. Vide = réglage d’origine."
                    options:
                      - { label: "Réglage d’origine", value: "" }
                      - { label: Centre, value: centre }
                      - { label: Haut, value: haut }
                      - { label: Bas, value: bas }
                      - { label: Gauche, value: gauche }
                      - { label: Droite, value: droite }
              - { label: Comprend de la vidéo, name: video, widget: boolean, default: false }
              - { label: Mise en avant, name: vedette, widget: boolean, default: false, hint: "Formule entourée de rose et choisie par défaut. Une seule à la fois." }
          - label: Prestations en concours
            name: concours
            widget: list
            summary: "{{fields.nom}} · {{fields.prix}} €"
            min: 1
            fields:
              - { label: Identifiant, name: id, widget: hidden }
              - { label: Nom, name: nom, widget: string, hint: "Ex. : Photo + vidéo" }
              - { label: Nom court, name: nomCourt, widget: string, required: false, hint: "Utilisé dans les listes et les boutons. Ex. : Photo + vidéo" }
              - { label: Prix (€), name: prix, widget: number, value_type: int, min: 0, hint: "Prix en euros, sans le symbole. Il se met à jour partout sur le site. Ex. : 60" }
              - { label: Description, name: description, widget: text, hint: "Phrase qui décrit le format, sous son nom. Ex. : Votre parcours en images, livré dans votre galerie privée." }
              - { label: Comprend de la photo, name: photo, widget: boolean, default: true }
              - { label: Comprend de la vidéo, name: video, widget: boolean, default: false }
              - { label: Mise en avant, name: vedette, widget: boolean, default: false }
          - label: Déplacement
            name: deplacement
            widget: object
            hint: "Le départ est votre adresse, à saisir dans « Coordonnées »."
            fields:
              - { label: Offert jusqu’à (km), name: gratuitJusqua, widget: number, value_type: int, min: 0, hint: "Distance en km depuis votre point de départ jusqu’à laquelle le déplacement est offert. Ex. : 20" }
              - { label: Prix par km au-delà (€), name: prixKm, widget: number, value_type: float, min: 0, step: 0.05, hint: "Prix de chaque kilomètre au-delà, en euros (avec un point pour la virgule). Ex. : 0.3" }
          - label: Galerie client
            name: galerieDemo
            widget: object
            fields:
              - { label: Photos incluses, name: quota, widget: number, value_type: int, min: 0, hint: "Nombre de photos comprises dans la formule. Ex. : 8" }
              - { label: Prix d’une photo en plus (€), name: prixPhoto, widget: number, value_type: int, min: 0, hint: "Prix en euros de chaque photo choisie en plus. Ex. : 10" }
          - label: Remise Écuries d’En Ségur
            name: remiseSegur
            widget: object
            fields:
              - { label: Remise (%), name: taux, widget: number, value_type: int, min: 1, max: 50, hint: "Pourcentage retiré du total pour les cavaliers des Écuries d’En Ségur. Il s’applique tout seul au calculateur de la page Séances, à la réservation, à l’accueil et aux questions fréquentes. Ex. : 10" }

      - name: contact
        label: Coordonnées
        file: src/contenu/contact.json
        fields:
          - { label: Adresse de départ, name: adresse, widget: string, hint: "Saisissez seulement votre commune ou code postal : ce fichier est public. C’est le point de départ du calcul des déplacements. Ex. : Toulouse ou 31000." }
          - { label: Téléphone, name: telephone, widget: string, hint: "Format : 06 12 34 56 78" }
          - { label: E-mail, name: email, widget: string, pattern: ['^[^\s@]+@[^\s@]+\.[^\s@]{2,}$', "Adresse e-mail invalide"], hint: "Adresse affichée au public et qui reçoit les demandes. Ex. : ilonagaigne@gmail.com" }
          - { label: Compte Instagram, name: instagram, widget: string, hint: "Sans le @" }
          - { label: Flux Instagram (Behold), name: fluxInstagram, widget: string, required: false, hint: "Adresse du flux donnée par behold.so (elle commence par https://feeds.behold.so/). Elle affiche vos derniers posts sur l’accueil. Vide = section masquée." }

      - name: interface
        label: Boutons et mots communs
        file: src/contenu/interface.json
        description: Les mots qui reviennent sur plusieurs pages (boutons, pastilles Photo et Vidéo, menu, pied de page). Modifiés ici une seule fois, ils changent partout sur le site.
        fields:
          - label: Pastilles
            name: etiquettes
            widget: object
            hint: "Les petites étiquettes posées sur les cartes de formules et les galeries."
            fields:
              - { label: Pastille photo, name: photo, widget: string, hint: "Ex. : Photo" }
              - { label: Pastille vidéo (dorée), name: video, widget: string, hint: "Ex. : Vidéo" }
              - { label: Pastille réseaux (pervenche), name: reseaux, widget: string, hint: "Ex. : Réseaux" }
          - label: Boutons
            name: boutons
            widget: object
            hint: "Les boutons qui se répètent d’une page à l’autre."
            fields:
              - { label: Bouton de réservation, name: reserver, widget: string, hint: "Sur l’accueil, les séances, l’Académie, le menu du téléphone et le bouton flottant. Ex. : Réserver une séance" }
              - { label: Bouton vers le quiz, name: trouverSeance, widget: string, hint: "Ex. : Trouver ma séance en 30 s" }
              - { label: Bouton vers les séances, name: voirSeances, widget: string, hint: "Sur l’accueil et la page introuvable. Ex. : Voir les séances" }
              - { label: Bouton vers la page Marques, name: parlerProjet, widget: string, hint: "Sur l’accueil, la page Marques et l’étude de cas. Ex. : Parler de votre projet" }
          - label: Mot « dès » devant un prix
            name: mots
            widget: object
            fields:
              - { label: Mot avant le prix, name: des, widget: string, hint: "Ex. : dès" }
          - label: Textes lus par les lecteurs d’écran
            name: lecteurs
            widget: object
            hint: "Ces textes restent invisibles : seuls les lecteurs d’écran (utilisés par les personnes aveugles ou malvoyantes) les lisent. Seule exception, « Aller au contenu » apparaît quand on navigue au clavier avec la touche Tab."
            fields:
              - { label: Lien d’évitement, name: allerContenu, widget: string, hint: "Premier lien de chaque page, visible seulement au clavier (touche Tab) et lu par les lecteurs d’écran : il saute le menu pour aller au contenu. Ex. : Aller au contenu" }
              - { label: Bouton qui ouvre le menu du téléphone, name: ouvrirMenu, widget: string, hint: "Lu seulement par les lecteurs d’écran : le bouton n’affiche qu’une icône. Ex. : Ouvrir le menu" }
              - { label: Chemin de navigation (fil d’Ariane), name: filAriane, widget: string, hint: "Lu seulement par les lecteurs d’écran : nom du chemin affiché au-dessus du titre des pages profondes. Ex. : Fil d’Ariane" }
              - { label: Nom d’une photo sans description, name: photoNumero, widget: string, hint: "Lu seulement par les lecteurs d’écran sur le bouton cœur d’une photo dont la description est vide. {n} est remplacé par le numéro de la photo (1, 2, 3…) : gardez-le. Ex. : photo {n}" }
          - label: Menu et pied de page
            name: menu
            widget: object
            hint: "Les mots du menu en haut, du menu du téléphone et du bas de chaque page. Les adresses des pages ne changent pas."
            fields:
              - label: Séances
                name: seances
                widget: object
                fields:
                  - { label: Nom dans le menu du haut, name: libelle, widget: string, hint: "Ex. : Séances équestres" }
                  - { label: Nom dans le menu du téléphone, name: court, widget: string, hint: "Plus court. Ex. : Séances" }
              - label: Concours
                name: concours
                widget: object
                fields:
                  - { label: Nom dans le menu du haut, name: libelle, widget: string, hint: "Ex. : Concours" }
                  - { label: Nom dans le menu du téléphone, name: court, widget: string, hint: "Plus court. Ex. : Concours" }
              - label: Marques
                name: marques
                widget: object
                fields:
                  - { label: Nom dans le menu du haut, name: libelle, widget: string, hint: "Aussi utilisé dans le fil d’Ariane de l’étude de cas. Ex. : Marques & réseaux" }
                  - { label: Nom dans le menu du téléphone, name: court, widget: string, hint: "Plus court. Ex. : Marques" }
              - label: Académie
                name: academie
                widget: object
                fields:
                  - { label: Nom dans le menu du haut, name: libelle, widget: string, hint: "Aussi utilisé dans le fil d’Ariane de la leçon. Ex. : Académie" }
                  - { label: Nom dans le menu du téléphone, name: court, widget: string, hint: "Plus court. Ex. : Académie" }
              - label: Journal
                name: journal
                widget: object
                fields:
                  - { label: Nom dans le menu du haut, name: libelle, widget: string, hint: "Aussi utilisé dans le fil d’Ariane de l’article. Ex. : Journal" }
                  - { label: Nom dans le menu du téléphone, name: court, widget: string, hint: "Plus court. Ex. : Journal" }
              - { label: Lien vers la galerie client (en haut), name: galerie, widget: string, hint: "Ex. : Ma galerie" }
              - { label: Lien vers la galerie client (menu du téléphone), name: galerieMenu, widget: string, hint: "Ex. : Accéder à ma galerie" }
              - { label: Bouton court de réservation, name: reserverCourt, widget: string, hint: "En haut à droite et dans le pied de page. Ex. : Réserver" }
              - { label: Premier maillon du fil d’Ariane, name: accueil, widget: string, hint: "Au-dessus du titre des pages profondes. Ex. : Accueil" }
              - { label: Pied de page · Tarifs, name: piedTarifs, widget: string, hint: "Ex. : Tarifs" }
              - { label: Pied de page · Questions, name: piedQuestions, widget: string, hint: "Ex. : Questions fréquentes" }
              - { label: Pied de page · Contact, name: piedContact, widget: string, hint: "Ex. : Contact" }
              - { label: Pied de page · Instagram, name: piedInstagram, widget: string, hint: "Ex. : Instagram" }
              - { label: Phrase du bas de page, name: piedMention, widget: string, hint: "L’année et le © s’ajoutent tout seuls devant. Ex. : Ilona Photographe · photographe équestre près de Toulouse" }

  - name: contenu
    label: Agenda, avis et questions
    description: Les concours où vous serez présente, les avis de vos clients, les questions fréquentes et les résultats GaloPlan.
    editor: { preview: false }
    files:
      - name: agenda
        label: Agenda des concours
        file: src/contenu/agenda.json
        description: Les concours où vous serez présente. Ils sont triés par date et disparaissent une fois passés.
        fields:
          - label: Concours
            name: concours
            widget: list
            required: false
            add_to_top: true
            summary: "{{fields.date | date('DD/MM/YYYY')}} · {{fields.nom}}"
            fields:
              - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true, hint: "Jour du concours. Il disparaît de la page une fois passé. Ex. : 14/06/2026" }
              - { label: Nom du concours, name: nom, widget: string, hint: "Nom du concours, tel qu’il s’affiche dans l’agenda. Ex. : Concours de saut d’obstacles" }
              - { label: Lieu, name: lieu, widget: string, required: false, hint: "Ex. : Écuries d’En Ségur, Muret" }
              - { label: Discipline, name: discipline, widget: string, required: false, hint: "Ex. : CSO, dressage, complet" }

      - name: temoignages
        label: Témoignages
        file: src/contenu/temoignages.json
        description: Avis de clients, publiés sur l’accueil. Demandez-leur l’accord avant de les mettre en ligne.
        fields:
          - label: Témoignages
            name: temoignages
            widget: list
            required: false
            summary: "{{fields.auteur}}"
            fields:
              - { label: Texte, name: texte, widget: text, hint: "Sans guillemets, ils sont ajoutés automatiquement." }
              - { label: Prénom du client, name: auteur, widget: string, hint: "Prénom seulement, avec l’accord du client. Ex. : Juliette" }
              - { label: Nom du cheval, name: cheval, widget: string, required: false, hint: "Affiché après le prénom. Ex. : Bingo" }
              - { label: Séance, name: seance, widget: string, required: false, hint: "Ex. : Séance Complicité" }

      - name: faq
        label: Questions fréquentes
        file: src/contenu/faq.json
        description: Affichées sur la page Séances, et lues par Google et les assistants IA. Les questions « Où se déroulent les séances ? » et « Combien coûte une séance ? » s’écrivent toutes seules à partir des formules.
        fields:
          - label: Questions
            name: questions
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string, hint: "La question, telle que la pose un visiteur. Ex. : Comment réserver ?" }
              - { label: Réponse, name: reponse, widget: text, hint: "Réponse claire en une ou deux phrases : Google et les assistants IA la reprennent. {taux} est remplacé par le taux de remise En Ségur saisi dans « Formules et tarifs » : ne le remplacez pas par un chiffre. Ex. : En quatre étapes sur la page Réservation : prestation, lieu…" }

      - name: galoplan
        label: Résultats GaloPlan
        file: src/contenu/galoplan.json
        description: La section « Résultats » de l’étude de cas s’affiche dès qu’une citation ou un chiffre est rempli.
        fields:
          - { label: Citation du client, name: citation, widget: text, required: false, hint: "Phrase du client, sans guillemets (ils s’ajoutent seuls). Vide = citation masquée." }
          - { label: Auteur de la citation, name: auteur, widget: string, required: false, hint: "Ex. : Fondateur de GaloPlan" }
          - label: Chiffres clés
            name: resultats
            widget: list
            required: false
            summary: "{{fields.valeur}} {{fields.libelle}}"
            fields:
              - { label: Chiffre, name: valeur, widget: string, hint: "Ex. : +40 %" }
              - { label: Signification, name: libelle, widget: string, hint: "Ex. : de téléchargements le premier mois" }

  - name: pages
    label: Pages du site
    description: "Textes, photos et vidéos de chaque page. Dans les titres, entourez un mot d’astérisques pour le surligner en rose : *pré*."
    editor: { preview: false }
    files:

      - name: page-index
        label: "Page Accueil"
        file: src/contenu/pages/index.json
        fields:
          - label: Référencement Google
            name: referencement
            widget: object
            fields:
              - { label: "Titre de la page (onglet du navigateur et Google)", name: titre, widget: string, hint: "Environ 60 caractères. Sur l’accueil, rien ne s’ajoute derrière. Ex. : Ilona Photographe · photographe équestre à Toulouse" }
              - { label: "Description pour Google", name: description, widget: text, hint: "Environ 150 caractères, affichée sous le titre dans les résultats de recherche. Ex. : Photographe et vidéaste équestre près de Toulouse : séances avec votre cheval, photos de concours." }
          - label: En-tête
            name: entete
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Photographe & vidéaste équestre · près de Toulouse" }
              - { label: "Titre caché (lu par Google et les lecteurs d’écran)", name: titreCache, widget: string, hint: "Le grand titre de l’accueil est une vidéo dans les lettres : ce texte la décrit sans s’afficher. Ex. : Surligner l’instant." }
              - { label: "Nom de la liste des repères (lecteurs d’écran)", name: reperesLibelle, widget: string, hint: "Lu à voix haute avant les repères, jamais affiché. Ex. : En bref" }
              - label: Vidéo du grand titre « Surligner l’instant »
                name: videoTitre
                widget: object
                hint: "La vidéo qui apparaît à l’intérieur des lettres du grand titre."
                fields:
                  - { label: Vidéo (ordinateur), name: fichier, widget: file, media_folder: /public/videos, public_folder: /videos, hint: "Fichier MP4, moins de 25 Mo. Ex. : titre-video.mp4" }
                  - { label: Vidéo (téléphone), name: fichierMobile, widget: file, media_folder: /public/videos, public_folder: /videos, hint: "Version plus légère, affichée sur téléphone." }
                  - { label: Image d’attente, name: affiche, widget: image, required: false, media_folder: /public/videos, public_folder: /videos, hint: "Image affichée le temps que la vidéo se charge." }
              - { label: Introduction, name: chapo, widget: text, hint: "Introduction, sous le titre. Ex. : Je photographie et filme les chevaux et leurs cavaliers, du…" }
              - label: Repères (sous l’introduction)
                name: reperes
                widget: list
                summary: "{{fields.fort}} {{fields.texte}}"
                hint: "{prix-seance} = le prix de la séance la moins chère, {taux} = le pourcentage de la remise En Ségur : ils se mettent à jour tout seuls."
                fields:
                  - { label: Mot en gras, name: fort, widget: string, hint: "{prix-seance} = le prix de la séance la moins chère, {taux} = la remise En Ségur. Ne les retirez pas. Ex. : Dès {prix-seance}" }
                  - { label: Suite, name: texte, widget: string, hint: "Suite du repère, après le mot en gras. Ex. : la séance" }
          - label: Grande photo
            name: grandePhoto
            widget: object
            fields:
              - { label: Photo, name: photo, widget: object, fields: *champs-photo }
              - { label: Légende, name: legende, widget: string, hint: "Légende posée sur la grande photo. Ex. : Séance au coucher du soleil · Haute-Garonne" }
          - label: Vous êtes…
            name: portes
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "*mot* = surligné en rose." }
              - label: Cartes
                name: cartes
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - { label: Titre, name: titre, widget: string, hint: "Titre de la carte : il décrit le visiteur. Ex. : Cavalier ou propriétaire" }
                  - { label: Texte, name: texte, widget: text, hint: "{prix-seance} et {prix-concours} = le prix le plus bas, mis à jour tout seul." }
                  - { label: Texte du lien, name: fleche, widget: string, hint: "Texte du lien en bas de la carte. Ex. : Trouver ma séance →" }
                  - { label: Lien (adresse de la page), name: lien, widget: string, hint: "Par exemple /concours" }
                  - { label: Photo, name: photo, widget: object, fields: *champs-photo }
          - label: Bonjour, moi c’est Ilona
            name: moi
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Bonjour, moi c’est Ilona" }
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: Texte, name: texte, widget: text, hint: "Texte de cette section. Ex. : Photographe et vidéaste spécialisée dans l’univers équestre…" }
              - { label: Liste, name: liste, widget: list, hint: "Une ligne par élément, sous le texte. Ex. : Photo animalière & portrait", field: { label: Ligne, name: ligne, widget: string } }
              - { label: Texte du bouton, name: bouton, widget: string, hint: "Mène à la page Séances. Ex. : Mon approche" }
              - { label: Photo, name: photo, widget: object, fields: *champs-photo }
          - label: Trois façons de garder l’instant
            name: offres
            widget: object
            hint: "Les prix des séances et des concours viennent de la page Tarifs."
            fields:
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: Mention, name: mention, widget: string, hint: "Petite ligne à côté du titre de la section. Ex. : Séances · Concours · Marques" }
              - { label: Titre de la carte Séances, name: seances, widget: string, hint: "Titre de la carte Séances. Ex. : Séances équestres" }
              - { label: Titre de la carte Concours, name: concours, widget: string, hint: "Titre de la carte Concours. Ex. : Concours" }
              - { label: Bouton de la carte Concours, name: boutonAgenda, widget: string, hint: "Mène à la page Concours. Ex. : Voir l’agenda" }
              - label: Carte Marques
                name: marques
                widget: object
                fields:
                  - { label: Titre, name: titre, widget: string, hint: "Titre de la carte Marques. Ex. : Marques & réseaux" }
                  - { label: Prix affiché, name: prix, widget: string, hint: "Ce qui s’affiche à la place d’un prix. Ex. : Sur devis" }
                  - { label: Liste, name: liste, widget: list, hint: "Une ligne par élément, dans la carte. Ex. : Contenu photo & vidéo", field: { label: Ligne, name: ligne, widget: string } }
          - label: Bandeau quiz
            name: quiz
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Vous hésitez entre deux formules ?" }
