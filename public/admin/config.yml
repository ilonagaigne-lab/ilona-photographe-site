              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Séances & tarifs · près de Toulouse" }
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: Introduction, name: chapo, widget: text, hint: "Introduction, sous le titre. Ex. : Quatre formules, du portrait sportif à la collection…" }
          - { label: Photo du bandeau, name: bandeau, widget: object, fields: *champs-photo }
          - label: Formules
            name: formules
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "*mot* = surligné en rose." }
              - { label: Mention, name: mention, widget: string, hint: "Petite ligne à côté du titre de la section. Ex. : Prix TTC · déplacement en sus" }
              - { label: Phrase avant le lien du quiz, name: quizTexte, widget: string, hint: "Ex. : Vous hésitez entre deux formules ?" }
              - { label: Lien vers le quiz, name: quizLien, widget: string, hint: "Ex. : Trouvez la vôtre en 30 secondes →" }
              - { label: Bouton de chaque formule, name: choisir, widget: string, hint: "{nom} = le premier mot du nom de la formule : ne le retirez pas. Ex. : Choisir {nom}" }
          - label: Vidéo
            name: video
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "*mot* = surligné en rose." }
              - { label: Texte, name: texte, widget: text, hint: "Texte de cette section. Ex. : Platinium d’en Fer, à la tombée du jour. Ajoutez la vidéo à…" }
              - { label: Texte du bouton, name: bouton, widget: string, hint: "Mène à la réservation. Ex. : Ajouter la vidéo" }
              - label: Vidéo
                name: video
                widget: object
                fields: *champs-video
          - label: Comment ça se passe
            name: deroule
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "Titre de ce bloc. *mot* = surligné en rose. Ex. : Comment ça se *passe*" }
              - label: Étapes
                name: etapes
                widget: list
                summary: "{{fields.titre}}"
                fields:
                  - { label: Titre, name: titre, widget: string, hint: "Nom de l’étape. Ex. : Vous réservez" }
                  - { label: Texte, name: texte, widget: text, hint: "Ce qui se passe à cette étape. Ex. : Formule, lieu et moment souhaité en quatre étapes. Je…" }
          - label: Calculateur
            name: calcul
            widget: object
            fields:
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: "Étape 1 : titre", name: formuleTitre, widget: string, hint: "Ex. : 1 · La formule" }
              - { label: "Étape 2 : titre", name: communeTitre, widget: string, hint: "Ex. : 2 · Votre commune" }
              - { label: Exemple grisé dans le champ commune, name: communeExemple, widget: string, hint: "Texte gris qui disparaît dès que l’on écrit. Ex. : Muret" }
              - { label: Aide sous le champ commune, name: communeAide, widget: string, hint: "Ex. : Tapez votre commune : je calcule la distance par la route. Ou réglez-la à la main." }
              - { label: Titre de la distance, name: distance, widget: string, hint: "{ville} = votre commune de départ, saisie dans « Coordonnées » : ne le retirez pas. Ex. : Distance depuis {ville} :" }
              - { label: Case des Écuries d’En Ségur, name: segur, widget: string, hint: "{taux} = le pourcentage saisi dans « Formules et tarifs » : ne le retirez pas. Ex. : Je suis cavalier ou cavalière aux Écuries d’En Ségur (-{taux} %)" }
              - { label: Titre de l’estimation, name: estimation, widget: string, hint: "Ex. : Estimation" }
              - { label: Ligne de la séance, name: ligneSeance, widget: string, hint: "{nom} = la formule choisie : ne le retirez pas. Ex. : Séance {nom}" }
              - { label: Ligne du déplacement, name: ligneDeplacement, widget: string, hint: "Ex. : Déplacement" }
              - { label: Ligne de la remise, name: ligneRemise, widget: string, hint: "Visible seulement quand la case En Ségur est cochée. Ex. : Remise En Ségur" }
              - { label: Titre du total, name: total, widget: string, hint: "Ex. : Total estimé" }
              - { label: Bouton de réservation, name: reserver, widget: string, hint: "Ex. : Réserver cette séance" }
              - { label: "Message : distance réglée à la main", name: distanceManuelle, widget: string, hint: "Ex. : Distance réglée à la main." }
              - { label: "Message : commune introuvable", name: communeIntrouvable, widget: string, hint: "Ex. : Commune introuvable : réglez la distance à la main." }
              - { label: "Message : distance impossible à calculer", name: distanceNonCalculee, widget: string, hint: "{commune} = la commune trouvée : ne le retirez pas. Ex. : {commune} : distance non calculée, Ilona la calculera." }
              - { label: "Message : distance calculée", name: distanceCalculee, widget: string, hint: "{commune} et {km} sont remplacés par la page : ne les retirez pas. Ex. : {commune} : {km} km par la route." }
          - label: Questions fréquentes
            name: faq
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "*mot* = surligné en rose. Les questions se modifient dans « Agenda, avis et questions »." }
              - { label: Phrase sous les questions, name: autreQuestion, widget: string, hint: "{telephone} et {email} deviennent des liens, avec les valeurs de « Coordonnées » : ne les retirez pas. Ex. : Une autre question ? Appelez Ilona au {telephone} ou écrivez à {email}." }
          - label: Fin de page
            name: fin
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "*mot* = surligné (aplat rose)." }

