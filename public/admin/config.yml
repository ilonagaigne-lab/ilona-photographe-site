              - &champ-titre-page { label: "Titre de la page (onglet du navigateur et Google)", name: titre, widget: string, hint: "Environ 60 caractères. « · Ilona Photographe » s’ajoute tout seul. Ex. : Séances photo équestres et tarifs" }
              - { label: "Description pour Google", name: description, widget: text, hint: "Environ 150 caractères, affichée sous le titre dans les résultats de recherche. {prix-seance} = le prix de la séance la moins chère, mis à jour tout seul : ne le retirez pas. Ex. : Séances photo équestres près de Toulouse, dès {prix-seance}. Calculez votre prix, déplacement compris." }
          - label: En-tête
            name: entete
            widget: object
