              - { label: Photos en supplément, name: supplement, widget: string, hint: "{extra} = les photos en plus, {prix} = le prix d’une photo, {total} = le montant avec son €. Ne les retirez pas. Ex. : + {extra} en supplément × {prix} € = {total}" }
              - { label: Bouton de validation, name: valider, widget: string, hint: "Ex. : Valider ma sélection" }
              - { label: Bouton quand il y a des photos en supplément, name: validerEtRegler, widget: string, hint: "{total} = le montant à régler : ne le retirez pas. Ex. : Valider et régler {total} €" }
              - { label: Message de démonstration, name: alerteDemo, widget: text, hint: "Affiché au clic sur le bouton tant que la galerie n’est qu’une démonstration. Ex. : Démonstration : ici, la sélection sera envoyée à Ilona." }
          - label: Photos
            name: photos
            widget: list
            summary: "{{fields.alt}}"
            hint: "Les photos s’affichent entières, sans recadrage."
            fields:
              - { label: Photo, name: image, widget: image, hint: "Photo en JPG, de préférence moins de 10 Mo. Ne supprimez pas de la médiathèque une photo encore utilisée sur le site : la mise en ligne échouerait." }
              - { label: Description de la photo, name: alt, widget: string, required: false, hint: "Pour les personnes malvoyantes et Google." }
              - { label: Déjà en favori (démo), name: on, widget: boolean, default: false }

      - name: page-404
        label: "Page introuvable (404)"
        file: src/contenu/pages/404.json
        fields:
          - label: Onglet du navigateur
            name: referencement
            widget: object
            hint: "Cette page n’est pas référencée par Google."
            fields:
              - { label: Titre de la page (onglet du navigateur), name: titre, widget: string, hint: "Ex. : Page introuvable" }
              - { label: Description, name: description, widget: text, hint: "Ex. : Cette page est sortie du cadre." }
          - label: En-tête
            name: entete
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne au-dessus du titre. Ex. : Erreur 404" }
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: Texte, name: texte, widget: text, hint: "Explication, sous le titre. Ex. : Cette page est sortie du cadre. Elle a peut-être changé…" }
              - { label: Bouton vers l’accueil, name: boutonAccueil, widget: string, hint: "Le bouton vers les séances vient de « Boutons et mots communs ». Ex. : Revenir à l’accueil" }
          - { label: Photo, name: photo, widget: object, fields: *champs-photo }
