      - name: page-academie-lumiere
        label: "Article Académie : la lumière du soir"
        file: src/contenu/pages/academie-lumiere.json
        fields:
          - label: Référencement Google
            name: referencement
            widget: object
            fields:
              - { label: Titre de l’article (onglet du navigateur et Google), name: titre, widget: string, hint: "Environ 60 caractères. « · Académie » s’ajoute tout seul. Ex. : Lire la lumière du soir" }
              - { label: Description pour Google, name: description, widget: text, hint: "Environ 150 caractères, affichée sous le titre dans les résultats de recherche. Ex. : Leçon de l’Académie : où placer votre cheval quand le soleil…" }
          - label: Sommaire du module
            name: sommaire
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petit titre de la liste des leçons du module. Ex. : Module · La lumière" }
              - { label: "Nom de la liste (lecteurs d’écran)", name: libelle, widget: string, hint: "Lu seulement par les lecteurs d’écran, jamais affiché. Ex. : Leçons du module" }
              - { label: Leçons, name: lecons, widget: list, hint: "La 3e leçon est celle de cette page ; les autres sont marquées avec le mot ci-dessous.", field: { label: Leçon, name: lecon, widget: string } }
              - { label: Mot ajouté aux leçons à venir, name: bientot, widget: string, hint: "Ex. : bientôt" }
          - label: En-tête
            name: entete
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Académie · Leçon 03 · lecture 6 min" }
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: Introduction, name: chapo, widget: text, hint: "Introduction, sous le titre. Ex. : Où placer votre cheval quand le soleil descend, et pourquoi…" }
          - { label: Photo principale, name: photo, widget: object, fields: *champs-photo }
          - label: Parties de l’article
            name: sections
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: Intertitre, name: titre, widget: string, hint: "Titre de cette partie de la leçon. Ex. : Pourquoi la fin de journée" }
              - { label: Texte, name: texte, widget: text, hint: "Une ligne vide = un nouveau paragraphe." }
          - label: Exercice
            name: exercice
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Exercice de la semaine" }
              - { label: Titre, name: titre, widget: string, hint: "Titre de ce bloc. Ex. : Trois photos, une heure" }
              - { label: Cases à cocher, name: etapes, widget: list, hint: "Une case par ligne. Ex. : Une photo en contre-jour, mise au point sur l’œil.", field: { label: Case, name: etape, widget: string } }
              - { label: Phrase avant le compte Instagram, name: partage, widget: string, hint: "Le compte Instagram s’ajoute tout seul derrière. Ex. : Partagez-les en identifiant" }
          - label: Bas de l’article
            name: fin
            widget: object
            fields:
              - { label: Bouton vers l’autre article, name: lireAussi, widget: string, hint: "Mène à l’article « Préparer son cheval ». Le bouton de réservation vient de « Boutons et mots communs ». Ex. : Lire aussi : préparer son cheval" }

      - name: page-journal-preparer
        label: "Article Journal : préparer son cheval"
        file: src/contenu/pages/journal-preparer.json
        fields:
          - label: Référencement Google
            name: referencement
            widget: object
            fields:
              - { label: Titre de l’article (onglet du navigateur et Google), name: titre, widget: string, hint: "Environ 60 caractères. « · Journal » s’ajoute tout seul. Ex. : Préparer son cheval pour sa séance photo" }
              - { label: Nom court (chemin de navigation en haut de page), name: nomCourt, widget: string, hint: "Version courte du titre pour le fil d’Ariane et l’onglet. Ex. : Préparer son cheval" }
              - { label: Description pour Google, name: description, widget: text, hint: "Environ 150 caractères, affichée sous le titre dans les résultats de recherche. Ex. : Pansage, crins, harnachement, tenue du cavalier : la liste…" }
          - label: En-tête
            name: entete
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : Journal · Avant la séance" }
              - { label: Titre, name: titre, widget: text, hint: "Un retour à la ligne = une nouvelle ligne. *mot* = surligné en rose." }
              - { label: Introduction, name: chapo, widget: text, hint: "Introduction, sous le titre. Ex. : Pansage, crins, tenue du cavalier : la liste simple à relire…" }
              - { label: Auteur, name: auteur, widget: string, hint: "Prénom de l’auteur, à côté de sa photo. Ex. : Ilona" }
              - { label: Temps de lecture, name: lecture, widget: string, hint: "Durée de lecture, après le prénom. Ex. : 5 min de lecture" }
              - { label: Photo de l’auteur, name: avatar, widget: object, fields: *champs-photo }
          - { label: Grande photo, name: bandeau, widget: object, fields: *champs-photo }
          - label: Parties de l’article
            name: sections
            widget: list
            summary: "{{fields.titre}}"
            fields:
              - { label: Intertitre, name: titre, widget: string, hint: "Titre de cette partie de l’article. Ex. : La veille" }
              - { label: Texte, name: texte, widget: text, hint: "Une ligne vide = un nouveau paragraphe." }
              - { label: Liste à puces (facultatif), name: liste, widget: list, required: false, hint: "Une ligne par puce. Vide = pas de liste dans cette partie. Ex. : Crins et queue démêlés", field: { label: Point, name: point, widget: string } }
              - label: Photo (facultatif)
                name: photo
                widget: object
                required: false
                collapsed: true
                hint: "Laissez vide pour une partie sans photo."
                # Copie des champs de l’ancre « champs-photo » où la photo n’est pas obligatoire : sans cela, une partie sans photo ne s’enregistre pas.
                fields:
                  - { label: Image, name: image, widget: image, required: false, choose_url: false, hint: "Photo en JPG, de préférence moins de 10 Mo. Ne supprimez pas de la médiathèque une photo encore utilisée sur le site : la mise en ligne échouerait." }
                  - { label: Description de la photo, name: alt, widget: string, required: false, hint: "Ce que montre la photo, pour Google et les personnes malvoyantes. Ex. : Cavalière et son cheval bai au pré." }
                  - label: Cadrage
                    name: cadrage
                    widget: select
                    required: false
                    default: ""
                    hint: "Partie de la photo à garder visible quand elle est recadrée. Vide = réglage d’origine."
                    options:
                      - { label: "Réglage d’origine", value: "" }
                      - { label: Centre, value: centre }
                      - { label: Haut, value: haut }
                      - { label: Bas, value: bas }
                      - { label: Gauche, value: gauche }
                      - { label: Droite, value: droite }
              - { label: Légende de la photo (facultatif), name: legende, widget: string, required: false, hint: "Légende sous la photo de cette partie. Ex. : Un filet propre, un frontal qui accroche la lumière." }
              - { label: Grande citation après cette partie (facultatif), name: citation, widget: text, required: false, hint: "*mot* = surligné en rose." }
          - label: Mémo
            name: memo
            widget: object
            fields:
              - { label: Petit titre, name: surtitre, widget: string, hint: "Petite ligne en capitales, au-dessus du titre. Ex. : À retenir" }
              - { label: Titre, name: titre, widget: string, hint: "Titre de l’encadré final. Ex. : Le mémo de la veille" }
              - { label: Points à retenir, name: points, widget: list, hint: "Une ligne par point à retenir. Ex. : Friandises, longe, un complice", field: { label: Point, name: point, widget: string } }
          - label: « À lire aussi »
            name: suite
            widget: object
            fields:
              - { label: Titre, name: titre, widget: string, hint: "*mot* = surligné en rose." }
              - { label: Étiquette, name: etiquette, widget: string, hint: "Pastille au-dessus du titre de l’article conseillé. Ex. : Académie" }
              - { label: Titre de l’article conseillé, name: article, widget: string, hint: "Titre de l’article conseillé. Ex. : Lire la lumière du soir" }
              - { label: Résumé, name: resume, widget: string, hint: "Résumé de l’article conseillé, en une phrase. Ex. : Où placer votre cheval quand le soleil descend." }
              - { label: Texte du bouton de réservation, name: bouton, widget: string, hint: "Mène à la réservation. Ex. : Réserver ma séance" }
              - { label: Photo, name: photo, widget: object, fields: *champs-photo }

