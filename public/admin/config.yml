              - { label: Phrase d’accroche, name: titre, widget: string, hint: "Phrase d’accroche sous le nom. Ex. : Le geste, l’effort, la concentration" }
              - { label: Texte, name: texte, widget: text, hint: "Pourquoi cette séance convient. Ex. : Votre couple en mouvement, au travail ou à l’obstacle : des…" }
